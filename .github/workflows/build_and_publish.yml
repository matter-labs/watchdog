name: Build and publish watchdog image

on:
  push:
    branches: ["main", "develop"]
    tags:
      - "*"
  pull_request:
    branches:
      - "main"

jobs:
  push_to_registry:
    name: Build and push Docker image
    runs-on: [matterlabs-ci-runner]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_AR_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Auth to google artifact registry
        run: |
          gcloud auth configure-docker us-docker.pkg.dev -q

      - name: Generate build ID for Flux Image Automation
        id: buildid
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "::set-output name=BUILD_ID::${GITHUB_REF#refs/*/}"
          else
            sha=$(git rev-parse --short HEAD)
            ts=$(date +%s%N | cut -b1-13)
            echo "::set-output name=BUILD_ID::${sha}-${ts}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          push: ${{ startsWith(github.ref, 'refs/tags') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: |
            "us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/watchdog:latest"
            "us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/watchdog:${{ steps.buildid.outputs.BUILD_ID }}"
          labels: |
            org.opencontainers.image.source=https://github.com/matter-labs/watchdog
            org.opencontainers.image.licenses="MIT"
          file: Dockerfile
